<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ffffff"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0a0a0a"
    />
    <meta
      name="description"
      content="Split a restaurant bill item by item, then send everyone their share."
    />

    <!-- iOS ignores the web manifest for Add to Home Screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bill Split" />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />

    <title>Bill Splitter Pro</title>
    <script>
      // Apply theme before React mounts so we never flash light-on-dark.
      (function () {
        try {
          var stored = localStorage.getItem("bsp.theme")
          var theme = stored === "light" ? "light" : "dark"
          document.documentElement.classList.toggle("dark", theme === "dark")
        } catch (_) {
          document.documentElement.classList.add("dark")
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
